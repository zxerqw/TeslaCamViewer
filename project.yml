name: TeslaCamViewer
options:
  bundleIdPrefix: me.melkor
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans  # Primary audience is Chinese Tesla owners
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "8"
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # xcodegen emits run-script phases that write into DerivedData
    SWIFT_STRICT_CONCURRENCY: complete
    # Code signing — applies to all targets. Team ID is public (visible in any
    # signed binary) so it's fine to commit.
    DEVELOPMENT_TEAM: SW7BAJUMAC
    CODE_SIGN_STYLE: Automatic
targets:
  TeslaCamViewer:
    type: application
    platform: iOS
    sources:
      - path: TeslaCamViewer
    info:
      path: TeslaCamViewer/Info.plist
      properties:
        CFBundleDisplayName: TeslaCamViewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: "用于把导出的行车记录仪视频保存到相册。"
        NSPhotoLibraryUsageDescription: "用于把导出的行车记录仪视频保存到相册。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.melkor.TeslaCamViewer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  TeslaCamViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TeslaCamViewerTests
        excludes:
          - "Fixtures/**"
      - path: TeslaCamViewerTests/Fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - target: TeslaCamViewer
    info:
      path: TeslaCamViewerTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.melkor.TeslaCamViewerTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TeslaCamViewer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TeslaCamViewer
schemes:
  TeslaCamViewer:
    build:
      targets:
        TeslaCamViewer: all
        TeslaCamViewerTests: [test]
    test:
      targets:
        - TeslaCamViewerTests
      gatherCoverageData: true
      coverageTargets:
        - TeslaCamViewer
    run:
      config: Debug
    archive:
      config: Release
