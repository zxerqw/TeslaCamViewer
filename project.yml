name: TeslaCamViewer
options:
  bundleIdPrefix: com.shanehou
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans  # Primary audience is Chinese Tesla owners
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # xcodegen emits run-script phases that write into DerivedData
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TeslaCamViewer:
    type: application
    platform: iOS
    sources:
      - path: TeslaCamViewer
    info:
      path: TeslaCamViewer/Info.plist
      properties:
        CFBundleDisplayName: TeslaCamViewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: "用于把导出的行车记录仪视频保存到相册。"
        NSPhotoLibraryUsageDescription: "用于把导出的行车记录仪视频保存到相册。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanehou.TeslaCamViewer
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  TeslaCamViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TeslaCamViewerTests
    dependencies:
      - target: TeslaCamViewer
    info:
      path: TeslaCamViewerTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanehou.TeslaCamViewerTests
        CODE_SIGN_STYLE: Automatic
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TeslaCamViewer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TeslaCamViewer
schemes:
  TeslaCamViewer:
    build:
      targets:
        TeslaCamViewer: all
        TeslaCamViewerTests: [test]
    test:
      targets:
        - TeslaCamViewerTests
      gatherCoverageData: true
      coverageTargets:
        - TeslaCamViewer
    run:
      config: Debug
    archive:
      config: Release
